#################################
#             Shadows           #
#################################

shadow = false;
shadow-radius = 17;
#shadow-opacity = 0.90;
shadow-offset-x = -9;
shadow-offset-y = -16;

shadow-color = "#000000";

shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'jgmenu'",
  "class_g = 'slop'",
  "class_g = 'scratch'",
  "class_g = 'retroarch'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

#################################
#           Fading              #
#################################

fading = true;

fade-delta = 6;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-workspaces = true;
no-fading-openclose = false;
no-fading-destroyed-argb = true;

fade-exclude = [
	"name = 'Eww - bar'",
    "class_g = 'slop'",
    "class_g = 'Polybar'",
    "class_g = 'scratch'"
];

#################################
#           Corners             #
#################################

corner-radius = 20

rounded-corners-exclude = [
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'popup'",
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'eww-bar'",
  "class_g = 'Viewnior'",
  "class_g = 'Rofi'",
  "class_g = 'mpv'",
  "class_g = 'retroarch'"
];

#################################
#   Transparency / Opacity      #
#################################

inactive-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'"       # maim
];

opacity-rule = [
  "70:class_g = 'kitty'",
  "85:class_g = 'FloaTerm'",
  "95:class_g = 'Updating'",
  "90:class_g = 'scratch'"
];

#################################
#       General Settings        #
#################################

backend = "xrender";

dithered-present = false;
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
glx-no-stencil = true;
use-damage = true;

log-level = "error";

#################################
#          Wintypes             #
#################################

wintypes:
{
  normal =  { fade = true; shadow = true };
  tooltip = { focus = true };
  dock =  { fade = true };
};
